<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>わたしの中学受検！</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
      crossorigin="anonymous" 
      referrerpolicy="no-referrer">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">
  </head>
  <body>
  
    <div id="loading">
      <div class="loading-content">
        <i class="fa-solid fa-granduation-cap loading-icon"></i>
        <h1 class="loading-title">わたしの中学受験！</h1>
        <div class="spinner"></div>
      </div>
    </div>

    <main class="main-content">
    </main>
    
    <nav class="bottom-nav">
      <button class="nav-item">
        <i class="fa-solid fa-house"></i><br>ホーム
      </button>
      <button class="nav-item">
        <i class="fa-solid fa-stopwatch"></i><br>タイマー
      </button>
      <button class="nav-item">
        <i class="fa-solid fa-pen-to-square"></i><br>メモ
      </button>
      <button class="nav-item">
        <i class="fa-solid fa-user"></i><br>マイページ
      </button>
    </nav>

    <script>
      window.addEventListener('load', () => {
        // ページが読み込まれてから1.5秒後にローディング画面を消す
        setTimeout(() => {
          const loading = document.getElementById('loading');
          loading.classList.add('loaded');
        }, 1500);
      });
    </script>
  </body>
</html>
